name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
